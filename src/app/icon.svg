<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Googly eyes: two overlapping eyes merged into one shape with a
       single orange #F0660D outline (no line where they overlap), white
       sclera, near-black pupils with a fixed glint, echoing the
       GooglyEyes component. Transparent so it sits on light and dark
       browser tabs alike. The outline is an inner stroke: an 8px stroke
       clipped to the shape leaves 4px inside the edge. -->
  <defs>
    <clipPath id="eyes">
      <path d="M32 24.517A15 15 0 1 0 32 39.483A15 15 0 1 0 32 24.517Z"/>
    </clipPath>
  </defs>
  <path d="M32 24.517A15 15 0 1 0 32 39.483A15 15 0 1 0 32 24.517Z" fill="#fff"/>
  <path d="M32 24.517A15 15 0 1 0 32 39.483A15 15 0 1 0 32 24.517Z" stroke="#F0660D" stroke-width="8" clip-path="url(#eyes)"/>
  <circle cx="21.5" cy="33.5" r="6" fill="#1C1917"/>
  <circle cx="47.5" cy="33.5" r="6" fill="#1C1917"/>
  <circle cx="19.8" cy="31.6" r="1.8" fill="#fff"/>
  <circle cx="45.8" cy="31.6" r="1.8" fill="#fff"/>
</svg>
