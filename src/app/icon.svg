<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Googly eyes: white sclera, orange #F0660D rim (4 units), near-black
       pupil with a fixed glint, echoing the GooglyEyes component. The
       eyes overlap by 4 units (outer radius 15, centres 26 apart); the
       right eye is drawn over the left. Transparent so it sits on light
       and dark browser tabs alike. -->
  <circle cx="19" cy="32" r="13" fill="#fff" stroke="#F0660D" stroke-width="4"/>
  <circle cx="45" cy="32" r="13" fill="#fff" stroke="#F0660D" stroke-width="4"/>
  <circle cx="21.5" cy="33.5" r="6" fill="#1C1917"/>
  <circle cx="47.5" cy="33.5" r="6" fill="#1C1917"/>
  <circle cx="19.7" cy="31.6" r="1.8" fill="#fff"/>
  <circle cx="45.7" cy="31.6" r="1.8" fill="#fff"/>
</svg>
