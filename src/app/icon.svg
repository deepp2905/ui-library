<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Googly eyes: white sclera, orange #F0660D rim, near-black pupil
       with a fixed glint, echoing the GooglyEyes component. The two eyes
       just touch (no gap). Transparent so it sits on light and dark
       browser tabs alike. -->
  <circle cx="17" cy="32" r="13" fill="#fff" stroke="#F0660D" stroke-width="4"/>
  <circle cx="47" cy="32" r="13" fill="#fff" stroke="#F0660D" stroke-width="4"/>
  <circle cx="19.5" cy="33.5" r="6" fill="#1C1917"/>
  <circle cx="49.5" cy="33.5" r="6" fill="#1C1917"/>
  <circle cx="17.7" cy="31.6" r="1.8" fill="#fff"/>
  <circle cx="47.7" cy="31.6" r="1.8" fill="#fff"/>
</svg>
